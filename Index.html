<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مصطفى زهير - تكسي خاص</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      font-family: Arial, Tahoma, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: #080808;
      border: 2px solid #d4af37;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.25);
    }

    .hero-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .buttons {
      padding: 20px 18px 25px;
    }

    .whatsapp,
    .call {
      display: block;
      width: 100%;
      padding: 18px 15px;
      border-radius: 15px;
      text-align: center;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .whatsapp {
      background: #25D366;
      color: white;
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.25);
    }

    .call {
      background: #d4af37;
      color: #080808;
      margin-bottom: 0;
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
    }

    .footer {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      padding: 0 10px 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <!-- صورة مصطفى -->
      <img
        src="./373bea11-e548-46fe-b70f-d148b1436a7d.jpeg"
        class="hero-image"
        alt="مصطفى زهير - تكسي خاص"
      >

      <div class="buttons">

        <!-- واتساب مباشر -->
        <a
          class="whatsapp"
          href="https://wa.me/9647764104277?text=السلام%20عليكم،%20أريد%20الاستفسار%20عن%20خدمة%20التكسي"
          target="_blank"
        >
          🟢 تواصل معي عبر واتساب
        </a>

        <!-- اتصال مباشر -->
        <a
          class="call"
          href="tel:+9647764104277"
        >
          📞 اتصال مباشر
        </a>

      </div>

      <div class="footer">
        مصطفى زهير — تكسي خاص
      </div>

    </div>

  </div>

</body>
</html>
